<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Cat Viewer</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐱</text></svg>">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0f0f1a; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
    #game-container {
      width: 100vw;
      height: 100vh;
      position: relative;
    }
    canvas { display: block; width: 100%; height: 100%; }
    .ui-overlay {
      position: absolute;
      top: 20px;
      left: 20px;
      color: #fff;
      pointer-events: none;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }
    .ui-overlay h1 {
      font-size: 24px;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .ui-overlay p {
      font-size: 14px;
      opacity: 0.8;
    }
    .ui-overlay a {
      color: #ffd700;
      pointer-events: auto;
    }
    #jump-msg {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      color: #ffd700;
      font-size: 28px;
      font-weight: bold;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
      text-shadow: 0 2px 8px rgba(255,215,0,0.4);
    }
    .loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #fff;
      font-size: 18px;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <div class="loading" id="loading">Loading 3D Engine...</div>
    <canvas id="cat-canvas"></canvas>
    <div class="ui-overlay">
      <h1>🐱 3D Cat Viewer</h1>
      <p>Click & drag to rotate • Scroll to zoom • Click cat to jump</p>
      <p><a href="./index.html">← Back to the game</a></p>
    </div>
    <div id="jump-msg">Meow! 🐾</div>
  </div>
  <script type="module" src="/src/viewer.js"></script>
</body>
</html>
